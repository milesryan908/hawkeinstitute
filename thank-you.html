<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You — Hawke Institute</title>
<style>
  :root {
    --light-blue: #52C9E8;
    --white: #FFFFFF;
    --dark-blue: #002D5D;
    --light-grey: #F5F5F5;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.5rem;
    background: var(--light-grey);
    color: var(--dark-blue);
    font-family: Candara, Calibri, "Segoe UI", "Trebuchet MS", sans-serif;
    text-align: center;
    padding: 1.5rem;
  }

  img {
    width: 100%;
    max-width: 220px;
    height: auto;
  }

  h1 {
    font-size: clamp(1.6rem, 5vw, 2.25rem);
  }

  p {
    max-width: 480px;
    color: var(--dark-blue);
  }

  a {
    color: var(--light-blue);
    font-weight: bold;
  }
</style>
</head>
<body>
  <img src="assets/logo.png" alt="Hawke Institute for Facility Systems">
  <h1>You're Entered!</h1>
  <p>Thanks for signing up — you're in the running for free entry into our Workforce Development Program. We'll be in touch as courses get closer to launching.</p>
  <a href="/">Back to home</a>
</body>
</html>
