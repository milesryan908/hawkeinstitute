<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hawke Institute for Facility Systems</title>
<style>
  :root {
    --light-blue: #52C9E8;
    --white: #FFFFFF;
    --dark-blue: #002D5D;
    --light-grey: #F5F5F5;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: Candara, Calibri, "Segoe UI", "Trebuchet MS", sans-serif;
    background: var(--white);
    color: var(--dark-blue);
  }

  header {
    display: flex;
    justify-content: center;
    padding: 2rem 1rem 1rem;
  }

  header img {
    width: 100%;
    max-width: 280px;
    height: auto;
  }

  .hero {
    background: var(--dark-blue);
    color: var(--white);
    text-align: center;
    padding: 3rem 1.5rem 4rem;
  }

  .eyebrow {
    color: var(--light-blue);
    font-size: 1rem;
    letter-spacing: 0.15em;
    font-weight: bold;
    margin-bottom: 1rem;
  }

  .hero h1 {
    font-size: clamp(2rem, 6vw, 3.5rem);
    line-height: 1.15;
  }

  .video-section {
    max-width: 800px;
    margin: -2.5rem auto 0;
    padding: 0 1.5rem;
    position: relative;
    z-index: 2;
  }

  .video-wrapper {
    aspect-ratio: 16 / 9;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0, 45, 93, 0.15);
  }

  .video-wrapper iframe {
    width: 100%;
    height: 100%;
    border: none;
  }

  .signup-section {
    background: var(--light-grey);
    text-align: center;
    padding: 4rem 1.5rem;
    margin-top: 3rem;
  }

  .signup-section h2 {
    max-width: 640px;
    margin: 0 auto 0.5rem;
    font-size: clamp(1.4rem, 3.5vw, 2rem);
    line-height: 1.3;
  }

  .signup-form-embed {
    margin-top: 2rem;
    display: flex;
    justify-content: center;
  }

  footer {
    text-align: center;
    padding: 2rem 1.5rem;
    color: var(--dark-blue);
    font-size: 0.85rem;
  }
</style>
</head>
<body>

<header>
  <img src="assets/logo.png" alt="Hawke Institute for Facility Systems">
</header>

<section class="hero">
  <p class="eyebrow">COMPREHENSIVE EDUCATION FOR THE COMMERCIAL HVAC INDUSTRY</p>
  <h1>Courses Start Late 2026</h1>
</section>

<section class="video-section">
  <div class="video-wrapper">
    <iframe
      src="https://www.youtube.com/embed/o2Q8EDJZpbA"
      title="Hawke Institute"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      allowfullscreen></iframe>
  </div>
</section>

<section class="signup-section">
  <h2>Please sign up below to stay informed on course releases.</h2>
  <div class="signup-form-embed">
    <script async src="https://eomail5.com/form/974d7f6c-91fa-11f1-b287-8f15c477bb50.js" data-form="974d7f6c-91fa-11f1-b287-8f15c477bb50"></script>
  </div>
</section>

<footer>
  &copy; 2026 Hawke Institute for Facility Systems
</footer>

</body>
</html>
